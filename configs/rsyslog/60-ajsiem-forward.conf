# Forward all Kali logs to Ubuntu Graylog Syslog TCP input (port 1514).
# Place on Kali as /etc/rsyslog.d/60-ajsiem-forward.conf

# Queue so brief SIEM outages do not drop everything
$ActionQueueType LinkedList
$ActionQueueFileName ajsiem_fwd
$ActionResumeRetryCount -1
$ActionQueueSaveOnShutdown on

*.* @@__SIEM_SERVER_IP__:1514;RSYSLOG_SyslogProtocol23Format
